name: singboard
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: singboard
      POSTGRES_USER: singboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-singboard-local}
    volumes:
      - board-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U singboard -d singboard"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      APP_MODE: ${APP_MODE:-demo}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      SINGULARITY_API_TOKEN: ${SINGULARITY_API_TOKEN:-}
      DB_URL: jdbc:postgresql://db:5432/singboard
      DB_USER: singboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-singboard-local}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  board-db:
